<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ThermalSense: planörlerden öğrenen termal tahmini</title>
    <meta name="description" content="ThermalSense, canlı planör trafiğinden kendi kendini eğiten bir termal tahmin haritasıdır: tıkladığınız noktanın çevresindeki yaklaşık 11 × 8 km'lik alanda, 50 metrelik hücrelerle tırmanış olasılığı." />
    <!--
      Theme, resolved before the bundle parses — the same bootstrap as
      index.html, reading the same key, so the landing page opens in whatever
      theme the visitor chose in the map app. Mirrors resolveInitialTheme() in
      src/theme/ThemeContext.jsx; change all three together.
    -->
    <script>
      (function () {
        var t = 'dark';
        try {
          var saved = localStorage.getItem('thermalsense.theme');
          if (saved === 'dark' || saved === 'light') {
            t = saved;
          } else if (window.matchMedia &&
                     window.matchMedia('(prefers-color-scheme: light)').matches) {
            t = 'light';
          }
        } catch (e) { /* storage or matchMedia blocked - keep the default */ }
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌡</text></svg>" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/landing/main.jsx"></script>
  </body>
</html>
